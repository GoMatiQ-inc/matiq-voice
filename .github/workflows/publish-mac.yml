name: Publish verified Mac installer
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful checks.yml run containing the verified signed Mac artifact
        required: true
        default: '41694057284'
permissions:
  contents: read
concurrency: publish-mac-release
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source run and download its tested Mac installer
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, re, subprocess
          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True)
          repo = os.environ['GITHUB_REPOSITORY']
          run_id = os.environ['SOURCE_RUN']
          assert re.fullmatch(r'[0-9]+', run_id), 'Provide a numeric Actions run ID.'
          run = json.loads(gh('api', f'repos/{repo}/actions/runs/{run_id}'))
          assert run['conclusion'] == 'success' and run['path'] == '.github/workflows/checks.yml', 'Source must be a successful checks.yml run.'
          assert run['head_repository']['full_name'] == repo, 'Fork artifacts cannot be published.'
          sha = run['head_sha']
          subprocess.run(['git', 'merge-base', '--is-ancestor', sha, 'origin/main'], check=True)
          jobs = json.loads(gh('api', f'repos/{repo}/actions/runs/{run_id}/jobs?per_page=100'))['jobs']
          required = {'desktop (macos-latest)', 'desktop (windows-latest)', 'signed (macos-latest)'}
          assert required <= {job['name'] for job in jobs if job['conclusion'] == 'success'}, 'Platform tests and protected Mac signing must all pass.'
          version = json.loads(subprocess.check_output(['git', 'show', f'{sha}:package.json'], text=True))['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version), 'Publish a stable package version.'
          gh('run', 'download', run_id, '--repo', repo, '--name', 'signed-installers-macOS-ARM64', '--dir', 'release-assets')
          folder = pathlib.Path('release-assets')
          name = f'MatiQ-Voice-{version}-mac-arm64.pkg'
          zip_name = f'MatiQ-Voice-{version}-mac-arm64.zip'
          tool_name = f'MatiQ-Voice-{version}-darwin-arm64.mqt'
          tool_assets = {tool_name, tool_name + '.release.json'}
          assets = {name, zip_name, 'latest-mac.yml'} | tool_assets
          optional = {zip_name + '.blockmap'}
          present = {p.name for p in folder.iterdir()}
          assert assets | {'mac-signature.json', 'suite-proof-darwin-arm64.json'} <= present and present <= assets | optional | {'mac-signature.json', 'suite-proof-darwin-arm64.json'}, 'Require only the verified installer, update ZIP, metadata and optional blockmap.'
          digest = hashlib.sha256((folder/name).read_bytes()).hexdigest()
          proof = json.loads((folder/'mac-signature.json').read_text())
          assert proof['version'] == version and proof['artifact'] == name and proof['sha256'] == digest, 'Verification report must cover these exact installer bytes.'
          assert proof['platform'] == 'darwin' and all(proof.get(k) is True for k in ['signed', 'notarized', 'stapled']) and proof.get('team'), 'Require Developer ID signatures and Apple notarization/stapling.'
          published = sorted(present - {'mac-signature.json', 'suite-proof-darwin-arm64.json'})
          suite = json.loads((folder/'suite-proof-darwin-arm64.json').read_text())
          assert suite['version'] == version and suite['target'] == 'darwin-arm64'
          for check in ['trusted-native-package','explicit-install','native-English-inference','busy-close-refusal','verified-disposal']:
              assert check in suite['checks'], f'Require actual hosted Voice qualification: {check}'
          assert set(suite['artifacts']) == tool_assets
          assert suite['packageSha256'] == suite['artifacts'][tool_name]
          assert set(proof.get('assets', {})) == set(published) - tool_assets, 'Signature report must cover every update asset.'
          checksums = []
          for asset in published:
              digest = hashlib.sha256((folder/asset).read_bytes()).hexdigest()
              assert (suite['artifacts'] if asset in tool_assets else proof['assets'])[asset] == digest, f'Verification report does not cover {asset} bytes.'
              checksums.append(f'{digest}  {asset}')
          (folder/'SHA256SUMS.txt').write_text('\n'.join(checksums) + '\n')
          notes = f"""MatiQ Voice {version} — signed Apple Silicon Mac installer

          Free local English dictation and meeting notes by [MatiQ Inc](https://matiqinc.com).

          Download **{name}** below. Supports Apple Silicon (M1 or newer), macOS 14.2 or newer. Intel Macs are not supported by this installer.

          The app, native engines and installer passed Developer ID signature verification, Apple notarization, stapling and Gatekeeper assessment. Packaged local transcription and both platform test jobs passed. [Verified build]({run['html_url']}); source commit `{sha}`.

          This release includes automatic update checks, background downloads and an explicit Restart to update action that waits until audio work is finished. The ZIP and latest-mac.yml are the verified in-app update assets. Older versions without the updater need this PKG once.

          Quit MatiQ Voice before installing the PKG. Open the PKG to install in Applications, then follow setup for local models, Microphone, Accessibility and keyboard access. Normal administrator and privacy permission prompts still apply. No compiler or developer account is required.

          **Windows signing is awaiting Microsoft company verification.** This release contains only the verified Mac installer; the older Windows preview remains unsigned.

          [Installation instructions](https://github.com/{repo}#download-and-install). Free personal and internal business use under the [No-Sale License](https://github.com/{repo}/blob/{sha}/LICENSE). Paid access, hosting and paid bundles require permission. Recognition can make mistakes; calendar and live meeting limitations remain documented in [VALIDATION.md](https://github.com/{repo}/blob/{sha}/docs/VALIDATION.md).
          """
          (folder/'RELEASE_NOTES.md').write_text(notes)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'RELEASE_TAG=v{version}\nSOURCE_SHA={sha}\n')
          PYTHON
      - name: Publish verified Mac download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release create "$RELEASE_TAG" release-assets/*.pkg release-assets/*.zip release-assets/*.blockmap release-assets/latest-mac.yml release-assets/*.mqt release-assets/*.mqt.release.json release-assets/SHA256SUMS.txt \
            --target "$SOURCE_SHA" --title "MatiQ Voice $RELEASE_TAG — signed Mac installer" \
            --notes-file release-assets/RELEASE_NOTES.md --latest
