name: MatiQ Voice checks and installers
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voice-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Configure installed-app OAuth registrations
        if: vars.MATIQ_MICROSOFT_CLIENT_ID != '' || vars.MATIQ_GOOGLE_CLIENT_ID != ''
        run: npm run oauth:configure
        env:
          MATIQ_MICROSOFT_CLIENT_ID: ${{ vars.MATIQ_MICROSOFT_CLIENT_ID }}
          MATIQ_GOOGLE_CLIENT_ID: ${{ vars.MATIQ_GOOGLE_CLIENT_ID }}
          MATIQ_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.MATIQ_GOOGLE_DESKTOP_CLIENT_SECRET }}
      - run: npm test
      - run: npm run engine:build
      - run: npm run test:e2e
      - run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify Mac installer destination and payload
        if: runner.os == 'macOS'
        run: npm run test:installer
      - run: npm run test:packaged
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MatiQ-Voice-${{ runner.os }}-${{ runner.arch }}
          retention-days: 7
          path: |
            dist/*.pkg
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            .validation/matiq-voice-e2e.png
            .validation/e2e-failure.png
            .validation/e2e-results.json
            .validation/packaged-results.json
          if-no-files-found: error
