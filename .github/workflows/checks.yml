name: MatiQ Voice checks and installers
on:
  push:
    branches: [main]
    tags: ['v*', '!v*-signing.*']
  pull_request:
  workflow_dispatch:
    inputs:
      signing:
        description: Validate signed packages from a release-validation tag (no publication)
        type: choice
        options: [none, mac, windows, both]
        default: none
permissions:
  contents: read
concurrency:
  group: voice-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Configure installed-app OAuth registrations
        if: vars.MATIQ_MICROSOFT_CLIENT_ID != '' || vars.MATIQ_GOOGLE_CLIENT_ID != ''
        run: npm run oauth:configure
        env:
          MATIQ_MICROSOFT_CLIENT_ID: ${{ vars.MATIQ_MICROSOFT_CLIENT_ID }}
          MATIQ_GOOGLE_CLIENT_ID: ${{ vars.MATIQ_GOOGLE_CLIENT_ID }}
          MATIQ_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.MATIQ_GOOGLE_DESKTOP_CLIENT_SECRET }}
      - run: npm test
      - name: Verify cold background capture and stalled-start cleanup
        run: npm run test:capture
      - name: Parse Windows signing verifier
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/verify-windows-signing.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
      - run: npm run engine:build
      - uses: actions/checkout@v4
        with:
          repository: GoMatiQ-inc/matiq-companion
          ref: 2a31fe6d3bc0afec6fe641ed5e53713a87c9edcc
          path: family-companion
      - run: npm run test:e2e
        env:
          MATIQ_COMPANION_SOURCE: ${{ github.workspace }}/family-companion
      - name: Verify native Windows caret insertion
        if: runner.os == 'Windows'
        run: npm run test:focus
      - run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify Mac installer destination and payload
        if: runner.os == 'macOS'
        run: npm run test:installer
      - run: npm run test:packaged
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MatiQ-Voice-${{ runner.os }}-${{ runner.arch }}
          retention-days: 7
          include-hidden-files: true
          path: |
            dist/*.pkg
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            .validation/hud-*.png
            .validation/matiq-voice-e2e.png
            .validation/e2e-failure.png
            .validation/e2e-results.json
            .validation/shared-models-results.json
            .validation/packaged-results.json
          if-no-files-found: error
      - name: Retain tested preview installers
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-installers-${{ runner.os }}-${{ runner.arch }}
          retention-days: 7
          path: |
            dist/*.pkg
            dist/*.exe
          if-no-files-found: error
  signed:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-preview.')) || (github.event_name == 'workflow_dispatch' && inputs.signing != 'none')
    needs: desktop
    environment: release-signing
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.signing == 'mac' && '["macos-latest"]' || inputs.signing == 'windows' && '["windows-latest"]' || '["macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require trusted source merged into main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run oauth:configure
        env:
          MATIQ_MICROSOFT_CLIENT_ID: ${{ vars.MATIQ_MICROSOFT_CLIENT_ID }}
          MATIQ_GOOGLE_CLIENT_ID: ${{ vars.MATIQ_GOOGLE_CLIENT_ID }}
          MATIQ_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.MATIQ_GOOGLE_DESKTOP_CLIENT_SECRET }}
      - run: npm run engine:build
      - name: Authenticate Windows signer with OIDC
        if: runner.os == 'Windows'
        uses: azure/login@935127ca5bb3c4b02c9c2c10060028383878f33f # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign and notarize Mac app and installer
        if: runner.os == 'macOS'
        run: npm run package:release
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
          CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}
          CSC_INSTALLER_NAME: ${{ secrets.CSC_INSTALLER_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Sign Windows app, native libraries and installer
        if: runner.os == 'Windows'
        run: npm run package:release
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          MATIQ_AZURE_SIGN_ENDPOINT: ${{ secrets.MATIQ_AZURE_SIGN_ENDPOINT }}
          MATIQ_AZURE_SIGN_ACCOUNT: ${{ secrets.MATIQ_AZURE_SIGN_ACCOUNT }}
          MATIQ_AZURE_SIGN_PROFILE: ${{ secrets.MATIQ_AZURE_SIGN_PROFILE }}
          MATIQ_WINDOWS_PUBLISHER: ${{ secrets.MATIQ_WINDOWS_PUBLISHER }}
      - name: Verify Mac installer payload
        if: runner.os == 'macOS'
        run: npm run test:installer
      - name: Verify Mac signing, stapling and Gatekeeper acceptance
        if: runner.os == 'macOS'
        run: node scripts/verify-mac-signing.mjs
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_INSTALLER_NAME: ${{ secrets.CSC_INSTALLER_NAME }}
      - name: Verify Windows publisher, Authenticode and timestamps
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-signing.ps1
        env:
          MATIQ_WINDOWS_PUBLISHER: ${{ secrets.MATIQ_WINDOWS_PUBLISHER }}
      - run: npm run test:packaged
      - uses: actions/checkout@v4
        with:
          repository: GoMatiQ-inc/matiq-solutions
          ref: fe010372a4e6bb46d2d92390fef842c8df80b39a
          path: suite-host
      - name: Install the exact suite integration harness
        working-directory: suite-host
        run: npm ci --no-audit --no-fund
      - name: Package the native standalone payload for the suite
        run: npm run tool:package
        env:
          MATIQ_TOOL_SIGNING_KEY: ${{ secrets.MATIQ_TOOL_SIGNING_KEY }}
      - name: Verify the native tool against suite publisher trust
        shell: bash
        env:
          MATIQ_SHARED_MODEL_ROOT: ${{ runner.temp }}/voice-models
        run: node suite-host/scripts/tool-package-fixture.cjs "dist/MatiQ-Voice-$(node -p "require('./package.json').version")-$(node -p "process.platform+'-'+process.arch").mqt.release.json" "$RUNNER_TEMP/tool-suite-fixture.json"
      - name: Qualify the actual tool payload inside the suite
        run: npm run test:suite
        env:
          MATIQ_SOLUTIONS_TEST_ROOT: ${{ github.workspace }}/suite-host
          MATIQ_SOLUTIONS_TEST_PACKAGE_CONFIG: ${{ runner.temp }}/tool-suite-fixture.json
      - uses: actions/upload-artifact@v4
        with:
          name: signed-installers-${{ runner.os }}-${{ runner.arch }}
          retention-days: 7
          path: |
            dist/*.pkg
            dist/*.mqt
            dist/*.mqt.release.json
            dist/suite-proof-*.json
            dist/*.exe
            dist/*-signature.json
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
  release:
    if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.desktop.result == 'success' && (contains(github.ref, '-preview.') || needs.signed.result == 'success')
    needs: [desktop, signed]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require source merged into main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ contains(github.ref, '-preview.') && 'release-installers-*' || 'signed-installers-*' }}
          merge-multiple: true
          path: release-assets
      - run: npm ci --ignore-scripts
      - name: Validate downloads and generate checksums and notes
        run: node scripts/prepare-release.mjs release-assets
        env:
          MATIQ_RELEASE_SIGNED: ${{ contains(github.ref, '-preview.') && '0' || '1' }}
      - name: Publish verified downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-preview.* ]]; then flags+=(--prerelease); fi
          shopt -s nullglob
          gh release create "$RELEASE_TAG" \
            release-assets/*.pkg release-assets/*.exe release-assets/*.zip release-assets/*.yml release-assets/*.blockmap release-assets/*.mqt release-assets/*.mqt.release.json release-assets/SHA256SUMS.txt \
            --verify-tag "${flags[@]}" \
            --title "MatiQ Voice $RELEASE_TAG" \
            --notes-file release-assets/RELEASE_NOTES.md
